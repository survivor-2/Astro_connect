<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | AstroVeda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="auth-page">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">Astro<span>Veda</span></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
      <nav class="primary-nav" id="primaryNav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="horoscope.html" class="nav-link">Horoscope</a>
        <a href="birth-chart.html" class="nav-link">Birth Chart</a>
        <a href="astrologers.html" class="nav-link">Astrologers</a>
        <a href="ai-astrology.html" class="nav-link">AI Guide</a>
        <a href="login.html" class="nav-login">Log in</a>
      </nav>
    </div>
  </header>

  <main class="auth-main signup-main">
    <section class="auth-card signup-card">
      <div class="auth-symbol">✧</div>
      <p class="eyebrow">BEGIN YOUR JOURNEY</p>
      <h1>Create your <em>account.</em></h1>
      <p class="auth-subtitle">Join AstroVeda and explore the world of astrology.</p>

      <form id="signupForm" class="auth-form">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" placeholder="Enter your full name" autocomplete="name" required>

        <label for="signupEmail">Email address</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" autocomplete="email" required>

        <label for="signupPhone">Mobile number</label>
        <input type="tel" id="signupPhone" placeholder="Enter 10-digit mobile number" autocomplete="tel" pattern="[0-9]{10}" maxlength="10" required>

        <label for="signupPassword">Create password</label>
        <div class="password-field">
          <input type="password" id="signupPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-target="signupPassword">Show</button>
        </div>

        <label for="confirmPassword">Confirm password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="Enter password again" autocomplete="new-password" required>
          <button type="button" class="password-toggle" data-target="confirmPassword">Show</button>
        </div>

        <label class="terms-label">
          <input type="checkbox" id="acceptTerms" required>
          <span>I agree to the terms and privacy policy.</span>
        </label>

        <button type="submit" class="button auth-submit">Create account</button>
        <p class="auth-message" id="signupMessage" aria-live="polite"></p>
      </form>

      <div class="auth-divider"><span>ALREADY A MEMBER?</span></div>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      <a href="index.html" class="auth-back">← Back to homepage</a>
    </section>
  </main>

  <footer class="auth-footer">
    <p>© <span id="currentYear"></span> AstroVeda. For educational and reflective purposes.</p>
  </footer>

  <script src="main.js"></script>
  <script src="auth.js"></script>
</body>
</html>
